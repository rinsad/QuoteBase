const heatScore = (q) =>
  q.signals ? q.signals.views + 2 * (q.signals.calls + q.signals.texts + q.signals.emails) : 0;

/* ---------- helpers ---------- */
const money = (n) =>
  n.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const money2 = (n) =>
  n.toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2 });

function quoteTotals(items) {
  let cost = 0, sell = 0;
  items.forEach((it) => {
    const lineCost = it.cost * it.qty;
    cost += lineCost;
    sell += lineCost * (1 + it.markup / 100);
  });
  const marginPct = sell > 0 ? ((sell - cost) / sell) * 100 : 0;
  return { cost, sell, margin: sell - cost, marginPct };
}

/* ---------- shared bits ---------- */
function StatusPill({ status }) {
  const C = useC();
  const map = {
    Draft: { fg: C.mute, bg: C.lineSoft, icon: FileText },
    Sent: { fg: C.blue, bg: C.blueSoft, icon: Send },
    "Follow-up due": { fg: C.amber, bg: C.amberSoft, icon: Clock },
    Won: { fg: C.green, bg: C.greenSoft, icon: CheckCircle2 },
    Lost: { fg: C.red, bg: C.redSoft, icon: XCircle },
  };
  const s = map[status];
  const Icon = s.icon;
  return (
    <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium whitespace-nowrap"
      style={{ color: s.fg, background: s.bg, ...display }}>
      <Icon size={11} strokeWidth={2.4} /> {status}
    </span>
  );
}

/* Signature element: cost vs margin split, visible everywhere */
function MarginBar({ marginPct, width = 120 }) {
  const C = useC();
  const m = Math.max(0, Math.min(100, marginPct));
  return (
    <div className="flex items-center gap-2">
      <div className="h-1.5 rounded-full overflow-hidden flex" style={{ width, background: C.costBar }}>
        <div style={{ width: `${100 - m}%` }} />
        <div style={{ width: `${m}%`, background: C.greenBar }} />
      </div>
      <span className="text-xs tabular-nums" style={{ ...mono, color: m < 22 ? C.red : C.green }}>
        {m.toFixed(1)}%
      </span>
    </div>
  );
}

function Kpi({ label, value, sub, accent }) {
  const C = useC();
  return (
    <div className="rounded-lg p-4 border" style={{ background: C.surface, borderColor: C.line }}>
      <div className="text-xs uppercase tracking-wide mb-1.5" style={{ color: C.faint, ...display, letterSpacing: "0.08em" }}>
        {label}
      </div>
      <div className="text-2xl font-semibold tabular-nums" style={{ ...mono, color: accent || C.ink }}>
        {value}
      </div>
      {sub && <div className="text-xs mt-1" style={{ color: C.mute }}>{sub}</div>}
    </div>
  );
}

/* ---------- AI assistant (conversational layer preview) ---------- */
function AiAssistant({ quotes, onOpen }) {
  const C = useC();
  const [input, setInput] = useState("");
  const [msgs, setMsgs] = useState([
    { role: "ai", text: "Ask me anything about your quotes — try \u201Cwhat\u2019s our win rate\u201D, \u201Cshow hot quotes\u201D, or \u201Cbiggest open quote\u201D." },
  ]);

  const answer = (q) => {
    const s = q.toLowerCase();
    const open = quotes.filter((r) => ["Sent", "Follow-up due", "Draft"].includes(r.status));
    const decided = quotes.filter((r) => ["Won", "Lost"].includes(r.status));
    const won = quotes.filter((r) => r.status === "Won");
    if (s.includes("win")) {
      const rate = decided.length ? Math.round((won.length / decided.length) * 100) : 0;
      return `Your win rate is ${rate}% — ${won.length} won of ${decided.length} decided, worth ${money(won.reduce((t, r) => t + quoteTotals(r.items).sell, 0))}.`;
    }
    if (s.includes("hot")) {
      const hot = [...open].sort((a, b) => heatScore(b) - heatScore(a))[0];
      return hot
        ? `Hottest quote right now: ${hot.id} — ${hot.customer} (${money(quoteTotals(hot.items).sell)}). ${hot.signals.views} views, ${hot.signals.calls} calls, ${hot.signals.texts} texts, ${hot.signals.emails} emails. They\u2019re engaged — worth a call today.`
        : "No open quotes with engagement signals yet.";
    }
    if (s.includes("big") || s.includes("largest") || s.includes("valuable")) {
      const big = [...open].sort((a, b) => quoteTotals(b.items).sell - quoteTotals(a.items).sell)[0];
      return big ? `Biggest open quote: ${big.id} — ${big.customer} at ${money(quoteTotals(big.items).sell)} (${quoteTotals(big.items).marginPct.toFixed(1)}% margin), ${big.age} old.` : "No open quotes.";
    }
    if (s.includes("open")) {
      return `${open.length} open quotes worth ${money(open.reduce((t, r) => t + quoteTotals(r.items).sell, 0))} total.`;
    }
    if (s.includes("follow")) {
      const due = quotes.filter((r) => r.status === "Follow-up due");
      return due.length ? `${due.length} follow-up${due.length > 1 ? "s" : ""} due: ${due.map((d) => `${d.id} (${d.customer})`).join(", ")}. Drafts are waiting for your approval.` : "No follow-ups due. The agent is watching open quotes.";
    }
    if (s.includes("margin")) {
      const avg = quotes.reduce((t, r) => t + quoteTotals(r.items).marginPct, 0) / quotes.length;
      return `Average margin across all quotes is ${avg.toFixed(1)}%. Lowest is ${[...quotes].sort((a, b) => quoteTotals(a.items).marginPct - quoteTotals(b.items).marginPct)[0].id}.`;
    }
    if (s.includes("lost")) {
      const lost = quotes.filter((r) => r.status === "Lost");
      return `${lost.length} lost, worth ${money(lost.reduce((t, r) => t + quoteTotals(r.items).sell, 0))}. The 60-day win-back sequence can re-engage them automatically.`;
    }
    return "In the full build I\u2019ll run real tool calls — create quotes, send follow-ups, search 20,000 records. In this preview, try: win rate \u00B7 hot quotes \u00B7 biggest open quote \u00B7 follow-ups due \u00B7 average margin \u00B7 lost quotes.";
  };

  const ask = () => {
    if (!input.trim()) return;
    setMsgs([...msgs, { role: "user", text: input }, { role: "ai", text: answer(input) }]);
    setInput("");
  };

  return (
    <div className="rounded-lg border mb-6 overflow-hidden" style={{ background: C.surface, borderColor: C.line }}>
      <div className="flex items-center gap-2 px-4 py-2.5 border-b" style={{ borderColor: C.lineSoft }}>
        <Sparkles size={14} style={{ color: C.green }} />
        <span className="text-sm font-medium" style={{ ...display, color: C.ink }}>Ask QuoteBase</span>
        <span className="text-xs ml-auto" style={{ color: C.faint }}>AI assistant · connected to your quotes</span>
      </div>
      <div className="px-4 py-3 space-y-2 max-h-48 overflow-y-auto">
        {msgs.map((m, i) => (
          <div key={i} className={`flex ${m.role === "user" ? "justify-end" : "justify-start"}`}>
            <div className="max-w-md px-3 py-2 rounded-lg text-sm leading-relaxed"
              style={m.role === "user"
                ? { background: C.green, color: "#fff" }
                : { background: C.greenSoft, color: C.ink }}>
              {m.text}
            </div>
          </div>
        ))}
      </div>
      <div className="flex gap-2 px-4 py-3 border-t" style={{ borderColor: C.lineSoft }}>
        <input value={input}
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && ask()}
          placeholder="Ask about quotes, customers, margins…"
          className="flex-1 px-3 py-2 text-sm rounded-md border outline-none"
          style={{ borderColor: C.line, color: C.ink, background: C.inputBg }} />
        <button onClick={ask}
          className="px-3.5 py-2 rounded-md text-sm font-medium text-white inline-flex items-center gap-1.5"
          style={{ background: C.green, ...display }}>
          <Send size={13} /> Ask
        </button>
      </div>
    </div>
  );
}

/* ---------- Hot & Big quotes ---------- */
function SignalChip({ icon: Icon, n }) {
  const C = useC();
  return (
    <span className="inline-flex items-center gap-1 text-xs tabular-nums" style={{ ...mono, color: n > 0 ? C.mute : C.faint }}>
      <Icon size={11} /> {n}
    </span>
  );
}

function HotAndBig({ quotes, onOpen }) {
  const C = useC();
  const open = quotes.filter((r) => ["Sent", "Follow-up due", "Draft"].includes(r.status));
  const hot = [...open].filter((q) => heatScore(q) > 0).sort((a, b) => heatScore(b) - heatScore(a)).slice(0, 3);
  const big = [...open].sort((a, b) => quoteTotals(b.items).sell - quoteTotals(a.items).sell).slice(0, 3);

  const Card = ({ title, icon: Icon, color, rows, render }) => (
    <div className="rounded-lg border overflow-hidden" style={{ background: C.surface, borderColor: C.line }}>
      <div className="flex items-center gap-2 px-4 py-2.5 border-b" style={{ borderColor: C.lineSoft }}>
        <Icon size={14} style={{ color }} />
        <span className="text-sm font-medium" style={{ ...display, color: C.ink }}>{title}</span>
      </div>
      <div>
        {rows.map((q) => (
          <button key={q.id} onClick={() => onOpen(q.id)}
            className="w-full flex items-center justify-between gap-3 px-4 py-2.5 border-t text-left qb-row"
            style={{ borderColor: C.lineSoft }}>
            {render(q)}
          </button>
        ))}
        {rows.length === 0 && <div className="px-4 py-6 text-center text-xs" style={{ color: C.faint }}>Nothing here yet.</div>}
      </div>
    </div>
  );

  return (
    <div className="grid lg:grid-cols-2 gap-3 mb-6">
      <Card title="Hot quotes" icon={Flame} color={C.amber} rows={hot}
        render={(q) => (
          <>
            <div className="min-w-0">
              <div className="text-sm font-medium truncate" style={{ color: C.ink }}>{q.customer}</div>
              <div className="flex items-center gap-3 mt-0.5">
                <SignalChip icon={Eye} n={q.signals.views} />
                <SignalChip icon={Phone} n={q.signals.calls} />
                <SignalChip icon={MessageSquare} n={q.signals.texts} />
                <SignalChip icon={Mail} n={q.signals.emails} />
              </div>
            </div>
            <div className="text-right shrink-0">
              <div className="text-sm tabular-nums font-medium" style={{ ...mono, color: C.ink }}>{money(quoteTotals(q.items).sell)}</div>
              <div className="text-xs" style={{ color: C.amber }}>heat {heatScore(q)}</div>
            </div>
          </>
        )} />
      <Card title="Big quotes" icon={ArrowUpRight} color={C.green} rows={big}
        render={(q) => (
          <>
            <div className="min-w-0">
              <div className="text-sm font-medium truncate" style={{ color: C.ink }}>{q.customer}</div>
              <div className="text-xs mt-0.5" style={{ color: C.faint }}>{q.id} · {q.age} · {q.status}</div>
            </div>
            <div className="text-right shrink-0">
              <div className="text-sm tabular-nums font-medium" style={{ ...mono, color: C.ink }}>{money(quoteTotals(q.items).sell)}</div>
              <div className="text-xs tabular-nums" style={{ ...mono, color: C.green }}>{quoteTotals(q.items).marginPct.toFixed(1)}%</div>
            </div>
          </>
        )} />
    </div>
  );
}

/* ---------- views ---------- */
function Dashboard({ quotes, onOpen, onNew }) {
  const C = useC();
  const [q, setQ] = useState("");
  const [filter, setFilter] = useState("All");

  const rows = useMemo(() => {
    return quotes.filter((r) => {
      const matchQ = (r.customer + r.id + r.contact).toLowerCase().includes(q.toLowerCase());
      const matchF = filter === "All" || r.status === filter;
      return matchQ && matchF;
    });
  }, [quotes, q, filter]);

  const open = quotes.filter((r) => ["Sent", "Follow-up due", "Draft"].includes(r.status));
  const openValue = open.reduce((s, r) => s + quoteTotals(r.items).sell, 0);
  const wonQuotes = quotes.filter((r) => r.status === "Won");
  const lostQuotes = quotes.filter((r) => r.status === "Lost");
  const wonValue = wonQuotes.reduce((s, r) => s + quoteTotals(r.items).sell, 0);
  const lostValue = lostQuotes.reduce((s, r) => s + quoteTotals(r.items).sell, 0);
  const quotedValue = quotes.reduce((s, r) => s + quoteTotals(r.items).sell, 0);
  const decided = quotes.filter((r) => ["Won", "Lost"].includes(r.status));
  const winRate = decided.length ? (wonQuotes.length / decided.length) * 100 : 0;
  const dueCount = quotes.filter((r) => r.status === "Follow-up due").length;

  return (
    <div>
      <div className="flex items-end justify-between mb-5">
        <div>
          <h1 className="text-xl font-semibold" style={{ ...display, color: C.ink }}>Quotes</h1>
          <p className="text-sm mt-0.5" style={{ color: C.mute }}>Tuesday, June 9 · {open.length} open</p>
        </div>
        <button onClick={onNew}
          className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-md text-sm font-medium"
          style={{ background: C.green, color: C.surface === "#FFFFFF" ? "#fff" : "#10231B", ...display }}>
          <Plus size={15} /> New quote
        </button>
      </div>

      <AiAssistant quotes={quotes} onOpen={onOpen} />

      <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-6">
        <Kpi label="Amount quoted" value={money(quotedValue)} sub={`${quotes.length} quotes · 30d`} />
        <Kpi label="Open" value={money(openValue)} sub={`${open.length} in play`} />
        <Kpi label="Won" value={money(wonValue)} sub={`${wonQuotes.length} quotes`} accent={C.green} />
        <Kpi label="Lost" value={money(lostValue)} sub={`${lostQuotes.length} quotes`} accent={C.red} />
        <Kpi label="Win rate" value={`${winRate.toFixed(0)}%`} sub={`${decided.length} decided`} />
        <Kpi label="Follow-ups" value={dueCount} sub="drafts ready" accent={dueCount ? C.amber : C.ink} />
      </div>

      <HotAndBig quotes={quotes} onOpen={onOpen} />

      <div className="rounded-lg border overflow-hidden" style={{ background: C.surface, borderColor: C.line }}>
        <div className="flex flex-wrap items-center gap-2 px-4 py-3 border-b" style={{ borderColor: C.lineSoft }}>
          <div className="relative flex-1 min-w-48">
            <Search size={14} className="absolute left-2.5 top-2.5" style={{ color: C.faint }} />
            <input value={q} onChange={(e) => setQ(e.target.value)}
              placeholder="Search customer or quote #"
              className="w-full pl-8 pr-3 py-1.5 text-sm rounded-md border outline-none"
              style={{ borderColor: C.line, color: C.ink, background: C.inputBg }} />
          </div>
          {["All", "Draft", "Sent", "Follow-up due", "Won", "Lost"].map((f) => (
            <button key={f} onClick={() => setFilter(f)}
              className="px-2.5 py-1 rounded-md text-xs font-medium"
              style={{ ...display,
                background: filter === f ? C.ink : "transparent",
                color: filter === f ? C.bg : C.mute }}>
              {f}
            </button>
          ))}
        </div>

        <table className="w-full text-sm">
          <thead>
            <tr className="text-left text-xs uppercase" style={{ color: C.faint, ...display, letterSpacing: "0.07em" }}>
              <th className="px-4 py-2.5 font-medium">Quote</th>
              <th className="px-4 py-2.5 font-medium">Customer</th>
              <th className="px-4 py-2.5 font-medium">Status</th>
              <th className="px-4 py-2.5 font-medium text-right">Value</th>
              <th className="px-4 py-2.5 font-medium">Margin</th>
              <th className="px-4 py-2.5 font-medium text-right">Age</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r) => {
              const t = quoteTotals(r.items);
              return (
                <tr key={r.id} onClick={() => onOpen(r.id)}
                  className="cursor-pointer border-t qb-row" style={{ borderColor: C.lineSoft }}>
                  <td className="px-4 py-3 tabular-nums" style={{ ...mono, color: C.ink }}>{r.id}</td>
                  <td className="px-4 py-3">
                    <div className="font-medium" style={{ color: C.ink }}>{r.customer}</div>
                    <div className="text-xs" style={{ color: C.faint }}>{r.contact}</div>
                  </td>
                  <td className="px-4 py-3"><StatusPill status={r.status} /></td>
                  <td className="px-4 py-3 text-right tabular-nums font-medium" style={{ ...mono, color: C.ink }}>
                    {money(t.sell)}

/* ---------- Pipeline (Pipedrive-style kanban) ---------- */
const STAGES = ["Draft", "Sent", "Follow-up due", "Won", "Lost"];

function Pipeline({ quotes, onOpen, onMove }) {
  const C = useC();
  const [dragId, setDragId] = useState(null);
  const [overStage, setOverStage] = useState(null);

  return (
    <div>
      <div className="mb-5">
        <h1 className="text-xl font-semibold" style={{ ...display, color: C.ink }}>Pipeline</h1>
        <p className="text-sm mt-0.5" style={{ color: C.mute }}>Drag quotes between stages — Won and Lost update your win rate.</p>
      </div>
      <div className="grid grid-cols-2 md:grid-cols-5 gap-3 items-start">
        {STAGES.map((stage) => {
          const cards = quotes.filter((q) => q.status === stage);
          const total = cards.reduce((s, q) => s + quoteTotals(q.items).sell, 0);
          const isOver = overStage === stage;
          return (
            <div key={stage}
              onDragOver={(e) => { e.preventDefault(); setOverStage(stage); }}
              onDragLeave={() => setOverStage(null)}
              onDrop={() => { if (dragId) onMove(dragId, stage); setDragId(null); setOverStage(null); }}
              className="rounded-lg border p-2 min-h-64"
              style={{
                background: isOver ? C.greenSoft : C.surface,
                borderColor: isOver ? C.green : C.line,
                borderStyle: isOver ? "dashed" : "solid",
              }}>
              <div className="px-1.5 pt-1 pb-2 flex items-baseline justify-between">
                <span className="text-xs font-semibold uppercase" style={{ ...display, color: C.mute, letterSpacing: "0.06em" }}>
                  {stage}
                </span>
                <span className="text-xs tabular-nums" style={{ ...mono, color: C.faint }}>{cards.length}</span>
              </div>
              <div className="px-1.5 pb-2 text-sm tabular-nums font-medium"
                style={{ ...mono, color: stage === "Won" ? C.green : stage === "Lost" ? C.red : C.ink }}>
                {money(total)}
              </div>
              <div className="space-y-2">
                {cards.map((q) => {
                  const t = quoteTotals(q.items);
                  return (
                    <div key={q.id} draggable
                      onDragStart={() => setDragId(q.id)}
                      onClick={() => onOpen(q.id)}
                      className="rounded-md border p-2.5 cursor-grab active:cursor-grabbing"
                      style={{ background: C.bg, borderColor: C.line, opacity: dragId === q.id ? 0.5 : 1 }}>
                      <div className="flex items-center justify-between mb-1">
                        <span className="text-xs tabular-nums" style={{ ...mono, color: C.faint }}>{q.id}</span>
                        <span className="text-xs" style={{ color: C.faint }}>{q.age}</span>
                      </div>
                      <div className="text-sm font-medium leading-snug mb-1.5" style={{ color: C.ink }}>{q.customer}</div>
                      <div className="flex items-center justify-between">
                        <span className="text-sm tabular-nums font-medium" style={{ ...mono, color: C.ink }}>{money(t.sell)}</span>
                        <span className="text-xs tabular-nums" style={{ ...mono, color: t.marginPct < 22 ? C.red : C.green }}>
                          {t.marginPct.toFixed(0)}%
                        </span>
                      </div>
                    </div>
                  );
                })}
                {cards.length === 0 && (
                  <div className="rounded-md border border-dashed p-3 text-center text-xs"
                    style={{ borderColor: C.line, color: C.faint }}>
                    Drop here
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

              aria-label={mode === "light" ? "Switch to dark mode" : "Switch to light mode"}
              className="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-medium border"
              style={{ borderColor: C.line, color: C.mute, ...display }}>
              {mode === "light" ? <Moon size={13} /> : <Sun size={13} />}
              {mode === "light" ? "Dark" : "Light"}
            </button>
            <button aria-label="Notifications" className="relative">
              <Bell size={16} style={{ color: C.mute }} />
              <span className="absolute -top-1 -right-1 w-2 h-2 rounded-full" style={{ background: C.amber }} />
            </button>
            <span className="text-xs px-2 py-1 rounded-full" style={{ background: C.greenSoft, color: C.green, ...display }}>
              Catalog v3 active
            </span>
          </header>
          <div className="p-6 max-w-6xl">
            {openQuote ? (
              <QuoteBuilder quote={openQuote} onBack={() => setOpenId(null)} onChange={updateQuote} />
            ) : view === "dash" ? (
              <Dashboard quotes={quotes} onOpen={setOpenId} onNew={newQuote} />
            ) : view === "pipeline" ? (
              <Pipeline quotes={quotes} onOpen={setOpenId} onMove={moveQuote} />
            ) : view === "automations" ? (
              <Automations />
            ) : view === "pricebook" ? (
              <PriceBook />
            ) : (
              <div className="rounded-lg border p-10 text-center text-sm"
                style={{ background: C.surface, borderColor: C.line, color: C.faint }}>
                {view === "customers" ? "Customer accounts live here — contacts, terms, quote history." : "Workspace settings — markup floors, approval rules, team roles."}
              </div>
            )}
          </div>
        </main>
      </div>
    </ThemeCtx.Provider>
  );
}


const _root = ReactDOM.createRoot(document.getElementById('root'));
_root.render(<QuoteBase />);

</script>
</body>
</html>
